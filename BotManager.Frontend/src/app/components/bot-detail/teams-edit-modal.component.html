<div class="modal-overlay" *ngIf="isOpen" (click)="closeModal()">
  <div class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Manage Teams</h3>
      <button class="close-btn" (click)="closeModal()">✕</button>
    </div>

    <div class="modal-body">
      <!-- Teams Section -->
      <div class="section">
        <h4>Teams</h4>
        <div class="teams-list">
          <div *ngFor="let team of localTeams; let i = index" class="team-item">
            <div *ngIf="editingTeamIndex === i" class="team-edit-form">
              <div class="form-row">
                <input type="text" [(ngModel)]="editingTeam.name" placeholder="Team Name" />
                <div class="emoji-select">
                  <button class="emoji-btn" (click)="openEmojiPicker(i)">{{ editingTeam.emoji || '🎯' }}</button>
                </div>
              </div>
              <input type="text" [(ngModel)]="editingTeam.leaderName" placeholder="Leader Name" />
              <input type="text" [(ngModel)]="editingTeam.contact" placeholder="Contact" />
              <div class="team-actions">
                <button class="btn btn-sm btn-primary" (click)="saveTeamEdit()">Save</button>
                <button class="btn btn-sm btn-outline" (click)="cancelEdit()">Cancel</button>
              </div>
            </div>

            <div *ngIf="editingTeamIndex !== i" class="team-display">
              <div class="team-header">
                <span class="emoji-display">{{ team.emoji || '🎯' }}</span>
                <strong class="team-name">{{ team.name }}</strong>
                <button class="emoji-edit-btn" (click)="openEmojiPicker(i)">🎨</button>
              </div>
              <div class="team-details">
                <span class="detail">👤 {{ team.leaderName }}</span>
                <span class="detail">📱 {{ team.contact }}</span>
              </div>
              <div class="team-actions">
                <button class="btn btn-sm btn-outline" (click)="startEditTeam(i)">Edit</button>
                <button class="btn btn-sm btn-outline-red" (click)="deleteTeam(i)">Delete</button>
              </div>
            </div>
          </div>

          <!-- New Team Form -->
          <div *ngIf="showNewTeamForm" class="team-item new-team-form">
            <div class="form-row">
              <input type="text" [(ngModel)]="newTeam.name" placeholder="Team Name" />
              <div class="emoji-select">
                <button class="emoji-btn" (click)="openEmojiPicker(-1)">{{ newTeam.emoji || '🎯' }}</button>
              </div>
            </div>
            <input type="text" [(ngModel)]="newTeam.leaderName" placeholder="Leader Name" />
            <input type="text" [(ngModel)]="newTeam.contact" placeholder="Contact" />
            <div class="team-actions">
              <button class="btn btn-sm btn-primary" (click)="addTeam()">Add Team</button>
              <button class="btn btn-sm btn-outline" (click)="cancelNewTeam()">Cancel</button>
            </div>
          </div>

          <button *ngIf="!showNewTeamForm" class="btn btn-sm btn-primary w-100" style="margin-top: 12px;" (click)="startNewTeam()">
            + Add Team
          </button>
        </div>
      </div>

      <!-- Emoji Picker -->
      <div class="emoji-picker-overlay" *ngIf="showEmojiPicker" (click)="closeEmojiPicker()">
        <div class="emoji-picker" (click)="$event.stopPropagation()">
          <div class="emoji-picker-header">
            <h4>Select Emoji</h4>
            <button class="close-btn" (click)="closeEmojiPicker()">✕</button>
          </div>
          <div class="emoji-grid">
            <button *ngFor="let emoji of emojiSuggestions" class="emoji-option" (click)="selectEmoji(emoji)">
              {{ emoji }}
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-outline" (click)="editJsonManually()">Edit JSON</button>
      <button class="btn btn-primary" (click)="saveChanges()">Save All Changes</button>
      <button class="btn btn-outline" (click)="closeModal()">Cancel</button>
    </div>
  </div>
</div>
