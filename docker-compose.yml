# Local/self-hosted stack: SQL Server + API + SPA (nginx on http://localhost:8080).
# Copy .env.example to .env and fill in the secrets first.
name: botmanager

services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?set MSSQL_SA_PASSWORD in .env}
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [backend]

  api:
    build:
      context: .
      dockerfile: BotManager.Backend.API/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__DefaultConnection: "Server=db,1433;Database=BotManagerDb;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true"
      JwtSettings__Secret: ${JWT_SECRET:?set JWT_SECRET in .env}
      AdminCredentials__Email: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      AdminCredentials__PasswordHash: ${ADMIN_PASSWORD_HASH:?set ADMIN_PASSWORD_HASH in .env}
      GoogleAuth__ClientId: ${GOOGLE_CLIENT_ID:-}
      Recaptcha__SiteKey: ${RECAPTCHA_SITE_KEY:-}
      Recaptcha__SecretKey: ${RECAPTCHA_SECRET_KEY:-}
      # nginx (frontend container) is the only trusted proxy. It always sends the real client IP as a single
      # X-Forwarded-For entry (also behind the optional Caddy TLS proxy, see docker-compose.https.yml).
      ReverseProxy__KnownNetworks__0: "172.28.0.0/16"
      # Plain http on localhost; docker-compose.https.yml forces true.
      Auth__CookieSecure: ${AUTH_COOKIE_SECURE:-false}
      DataProtection__CertificatePath: ${DATA_PROTECTION_CERT_PATH:-}
      DataProtection__CertificatePassword: ${DATA_PROTECTION_CERT_PASSWORD:-}
    networks: [backend]

  web:
    build:
      context: BotManager.Frontend
    depends_on: [api]
    ports:
      - "8080:8080"
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mssql-data:
